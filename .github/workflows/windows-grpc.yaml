name: Workrave Windows gRPC dependency

permissions:
  id-token: write
  attestations: write
  contents: write

concurrency:
  group: windows-grpc-dependency-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - "windows/build-grpc.sh"
      - "windows/smoke/**"
      - "conan/smoke/grpc-af-unix.cpp"
      - "windows/mingw-w64-clang-x86_64-workrave-grpc/**"
      - ".github/workflows/windows-grpc.yaml"
      - ".gitattributes"
  pull_request:
    branches:
      - main
    paths:
      - "windows/build-grpc.sh"
      - "windows/smoke/**"
      - "conan/smoke/grpc-af-unix.cpp"
      - "windows/mingw-w64-clang-x86_64-workrave-grpc/**"
      - ".github/workflows/windows-grpc.yaml"
      - ".gitattributes"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    name: Build patched gRPC 1.85.0 and Python packages

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            base-devel
            git
            mingw-w64-clang-x86_64-abseil-cpp
            mingw-w64-clang-x86_64-c-ares
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-gcc-compat
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-openssl
            mingw-w64-clang-x86_64-pkg-config
            mingw-w64-clang-x86_64-protobuf
            mingw-w64-clang-x86_64-re2
            mingw-w64-clang-x86_64-zlib
            mingw-w64-clang-x86_64-cython
            mingw-w64-clang-x86_64-python-build
            mingw-w64-clang-x86_64-python-installer
            mingw-w64-clang-x86_64-python-setuptools
            mingw-w64-clang-x86_64-python-protobuf
            mingw-w64-clang-x86_64-python-typing_extensions

      - name: Build gRPC package
        run: bash windows/build-grpc.sh

      - name: Verify installed gRPC package and Unix socket connection
        run: |
          pacman -U --noconfirm windows/_deploy/*.pkg.tar.zst
          cmake -S windows/smoke -B windows/_build/smoke -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build windows/_build/smoke
          ctest --test-dir windows/_build/smoke --output-on-failure
          python windows/smoke/python-grpc.py

      - name: Upload gRPC package artifact
        uses: actions/upload-artifact@v4
        with:
          name: workrave-grpc-mingw-clang64
          path: windows/_deploy/*.pkg.tar.zst
          retention-days: 14

      - name: Generate artifact attestation
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: windows/_deploy/*.pkg.tar.zst

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    name: Publish latest gRPC package
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download gRPC package artifact
        uses: actions/download-artifact@v4
        with:
          name: workrave-grpc-mingw-clang64
          path: .

      - name: Replace windows-grpc-latest release
        shell: bash
        run: |
          gh release delete windows-grpc-latest --yes || true
          git push --delete origin windows-grpc-latest || true
          gh release create windows-grpc-latest \
            ./*.pkg.tar.zst \
            --target "${{ github.sha }}" \
            --title "Workrave gRPC 1.85.0 for MinGW CLANG64" \
            --notes "MSYS2 gRPC 1.85.0 shared libraries, python-grpcio and python-grpcio-tools, with MinGW AF_UNIX support. Commit: ${{ github.sha }}" \
            --prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
