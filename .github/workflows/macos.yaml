name: Conan macOS dependencies

on:
  push:
    branches: [main]
    paths: ['conan/**', '.github/workflows/macos.yaml']
  pull_request:
    branches: [main]
    paths: ['conan/**', '.github/workflows/macos.yaml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: dependencies-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    env:
      CONAN_HOME: ${{ github.workspace }}/conan/_build/conan-home-macos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build tools
        run: |
          python -m pip install conan==2.34.0
          brew install cmake ninja pkgconf
      - name: Test universal merging and relocation
        run: python -m unittest discover -s conan/tests -p test_macos_sdk.py -v
      - name: Identify Xcode and SDK for cache reuse
        id: xcode
        run: |
          key=$({ xcodebuild -version; xcrun clang --version; xcrun --show-sdk-version; } | shasum -a 256 | cut -d ' ' -f 1)
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-macos-${{ runner.arch }}-${{ steps.xcode.outputs.key }}-${{ hashFiles('conan/macos.lock', 'conan/conanfile.py', 'conan/setup.py', 'conan/patches/**', 'conan/config/**') }}
          restore-keys: |
            conan-macos-${{ runner.arch }}-${{ steps.xcode.outputs.key }}-
      - name: Check both locked dependency graphs
        run: python conan/build.py --platform macos --check
      - name: Build and validate universal SDK
        run: python conan/build.py --platform macos --jobs 4
      - name: Archive SDK with symlinks and executable modes
        run: tar -czf workrave-dependencies-macos.tar.gz -C conan/_build/macos-universal .
      - uses: actions/upload-artifact@v4
        with:
          name: workrave-dependencies-macos
          path: workrave-dependencies-macos.tar.gz
          retention-days: 14

  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: workrave-dependencies-macos
      - name: Publish macOS dependency SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            target_tag="$GITHUB_REF_NAME"
            title="Workrave macOS Dependencies $GITHUB_REF_NAME"
            release_options=()
          else
            target_tag=macos-latest
            title='Workrave macOS Dependencies (Latest)'
            release_options=(--prerelease)
            # Preserve the existing moving-tag and asset-name contract.
            gh release delete macos-latest --yes || true
            git push --delete origin macos-latest || true
          fi
          cat > release-notes.md <<EOF
          Universal arm64+x86_64 Conan dependency SDK for Workrave, targeting macOS 14.4.
          Qt is deployed as dylibs. The archive contains a relocatable CMake toolchain,
          native deployment/code-generation tools, and a package manifest.

          Commit: $GITHUB_SHA
          EOF
          gh release create "$target_tag" ./workrave-dependencies-macos.tar.gz \
            --target "$GITHUB_SHA" --title "$title" --notes-file release-notes.md \
            "${release_options[@]}"
      - uses: actions/attest-build-provenance@v1
        with:
          subject-path: workrave-dependencies-macos.tar.gz
